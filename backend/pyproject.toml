[project]
name = "offerloop"
version = "1.0.0"
description = "OfferLoop — a sales CRM for your job search. Built on Google Cloud."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # Firebase auth helper proxy (live mode)
    "cryptography>=42",  # at-rest encryption for user-supplied API keys
    # Live (GCP) mode — imported lazily, demo mode never touches them
    "google-genai>=1.16",
    "google-cloud-firestore>=2.16",
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends-in-defaults pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal CSV fixtures read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
